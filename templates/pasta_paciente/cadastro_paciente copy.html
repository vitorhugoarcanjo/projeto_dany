<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='pasta_paciente/cadastro_paciente.css') }}">
    <title>Cadastro Paciente</title>
    
</head>
<body>
    <h1>Cadastro de Paciente</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li style="color: {{ 'red' if category == 'error' else 'green' }};">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
        <label>Nome</label><br>
        <input type="text" name="nome" required value="{{ nome|default('') }}"><br><br>

        <label>CPF</label><br>
        <input type="text" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}" placeholder="000.000.000-00" value="{{ request.form.cpf }}"><br><br>

        <label>Telefone</label><br>
        <input type="tel" name="telefone" placeholder="(00) 00000-0000" value="{{ telefone|default('') }}"><br><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
