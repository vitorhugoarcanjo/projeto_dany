<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='pasta_consulta_medica/pagina_7.css') }}">
    <title>Ansiedade, Apatia e Comportamento</title>
</head>
<body>
    <h1>Ansiedade, Apatia e Comportamento</h1>
    <form method="post">

        <h3>Ansiedade</h3>
        <label>Fica preocupado sobre eventos planejados?</label><br>
        <input type="radio" name="ansiedade_preocupacao" value="sim" id="ansiedade_preocupacao_sim"><label for="ansiedade_preocupacao_sim">Sim</label>
        <input type="radio" name="ansiedade_preocupacao" value="nao" id="ansiedade_preocupacao_nao" checked><label for="ansiedade_preocupacao_nao">Não</label><br><br>

        <label>É incapaz de relaxar ou é excessivamente tenso?</label><br>
        <input type="radio" name="ansiedade_relaxar" value="sim" id="ansiedade_relaxar_sim"><label for="ansiedade_relaxar_sim">Sim</label>
        <input type="radio" name="ansiedade_relaxar" value="nao" id="ansiedade_relaxar_nao" checked><label for="ansiedade_relaxar_nao">Não</label><br><br>

        <label>Preocupa-se excessivamente mesmo com coisas triviais?</label><br>
        <input type="radio" name="ansiedade_trivial" value="sim" id="ansiedade_trivial_sim"><label for="ansiedade_trivial_sim">Sim</label>
        <input type="radio" name="ansiedade_trivial" value="nao" id="ansiedade_trivial_nao" checked><label for="ansiedade_trivial_nao">Não</label><br><br>

        <h3>Apatia</h3>
        <label>Não tem interesse pelo mundo à (sua) volta?</label><br>
        <input type="radio" name="apatia_interesse" value="sim" id="apatia_interesse_sim"><label for="apatia_interesse_sim">Sim</label>
        <input type="radio" name="apatia_interesse" value="nao" id="apatia_interesse_nao" checked><label for="apatia_interesse_nao">Não</label><br><br>

        <label>Está mais difícil engajar-se em conversas ou em afazeres?</label><br>
        <input type="radio" name="apatia_engajamento" value="sim" id="apatia_engajamento_sim"><label for="apatia_engajamento_sim">Sim</label>
        <input type="radio" name="apatia_engajamento" value="nao" id="apatia_engajamento_nao" checked><label for="apatia_engajamento_nao">Não</label><br><br>

        <label>Está mais indiferente?</label><br>
        <input type="radio" name="apatia_indiferente" value="sim" id="apatia_indiferente_sim"><label for="apatia_indiferente_sim">Sim</label>
        <input type="radio" name="apatia_indiferente" value="nao" id="apatia_indiferente_nao" checked><label for="apatia_indiferente_nao">Não</label><br><br>

        <h3>Desinibição</h3>
        <label>Age impulsivamente, sem pensar?</label><br>
        <input type="radio" name="desinibicao_impulsivo" value="sim" id="desinibicao_impulsivo_sim"><label for="desinibicao_impulsivo_sim">Sim</label>
        <input type="radio" name="desinibicao_impulsivo" value="nao" id="desinibicao_impulsivo_nao" checked><label for="desinibicao_impulsivo_nao">Não</label><br><br>

        <label>Tem dito coisas que não devem ser faladas em público?</label><br>
        <input type="radio" name="desinibicao_dizer" value="sim" id="desinibicao_dizer_sim"><label for="desinibicao_dizer_sim">Sim</label>
        <input type="radio" name="desinibicao_dizer" value="nao" id="desinibicao_dizer_nao" checked><label for="desinibicao_dizer_nao">Não</label><br><br>

        <label>Tem agido de forma constrangedora?</label><br>
        <input type="radio" name="desinibicao_comportamento" value="sim" id="desinibicao_comportamento_sim"><label for="desinibicao_comportamento_sim">Sim</label>
        <input type="radio" name="desinibicao_comportamento" value="nao" id="desinibicao_comportamento_nao" checked><label for="desinibicao_comportamento_nao">Não</label><br><br>

        <label>Mudou a personalidade? Está mais isolado socialmente?</label><br>
        <input type="radio" name="desinibicao_personalidade" value="sim" id="desinibicao_personalidade_sim"><label for="desinibicao_personalidade_sim">Sim</label>
        <input type="radio" name="desinibicao_personalidade" value="nao" id="desinibicao_personalidade_nao" checked><label for="desinibicao_personalidade_nao">Não</label><br><br>

        <h3>Agitação</h3>
        <label>O paciente é pouco cooperativo?</label><br>
        <input type="radio" name="agitacao_cooperativo" value="sim" id="agitacao_cooperativo_sim"><label for="agitacao_cooperativo_sim">Sim</label>
        <input type="radio" name="agitacao_cooperativo" value="nao" id="agitacao_cooperativo_nao" checked><label for="agitacao_cooperativo_nao">Não</label><br><br>

        <label>Não permite ser ajudado?</label><br>
        <input type="radio" name="agitacao_ajuda" value="sim" id="agitacao_ajuda_sim"><label for="agitacao_ajuda_sim">Sim</label>
        <input type="radio" name="agitacao_ajuda" value="nao" id="agitacao_ajuda_nao" checked><label for="agitacao_ajuda_nao">Não</label><br><br>

        <label>O paciente é agressivo verbal ou fisicamente?</label><br>
        <input type="radio" name="agitacao_agressivo" value="sim" id="agitacao_agressivo_sim"><label for="agitacao_agressivo_sim">Sim</label>
        <input type="radio" name="agitacao_agressivo" value="nao" id="agitacao_agressivo_nao" checked><label for="agitacao_agressivo_nao">Não</label><br><br>

        <label>Fica mexendo em objetos à sua volta repetidamente?</label><br>
        <input type="radio" name="agitacao_ritual" value="sim" id="agitacao_ritual_sim"><label for="agitacao_ritual_sim">Sim</label>
        <input type="radio" name="agitacao_ritual" value="nao" id="agitacao_ritual_nao" checked><label for="agitacao_ritual_nao">Não</label><br><br>

        <button type="submit">Próxima</button>
    </form>
</body>
</html>
