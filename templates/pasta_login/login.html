<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConectaPrev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2a0751 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo-login {
            margin-bottom: 30px;
        }

        .logo-login img {
            max-width: 180px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .logo-login h1 {
            color: #6a11cb;
            font-size: 22px;
            font-weight: 700;
        }

        .login-form h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6a11cb;
        }

        .btn-login {
            background: linear-gradient(135deg, #6a11cb 0%, #8a2be2 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #4d0a9e 0%, #6a11cb 100%);
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3a3;
            border: 1px solid #cfc;
        }

        .link-cadastro {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .link-cadastro a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 500;
        }

        .link-cadastro a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .logo-login img {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-login">
            <img src="{{ url_for('static', filename='images/logo_conecta.jpg') }}" 
                 alt="CONECTA PREFV">
            <h1>CONECTA PREV</h1>
        </div>

        <div class="login-form">            
            <div id="alerta" class="alert"></div>
            
            <form method="POST" action="{{ url_for('login.login') }}">
                <div class="form-group">
                    <label for="login">Login:</label>
                    <input type="text" id="login" name="login" required 
                           placeholder="Digite seu login">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required 
                           placeholder="Digite sua senha">
                </div>
                
                <button type="submit" class="btn-login">ENTRAR</button>
            </form>
            
        </div>
    </div>

    <script>
        function mostrarAlerta(mensagem, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.textContent = mensagem;
            alerta.className = 'alert alert-' + tipo;
            alerta.style.display = 'block';
            setTimeout(() => { alerta.style.display = 'none'; }, 5000);
        }

        // Verificar mensagens flash do Flask
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    mostrarAlerta("{{ message }}", "{{ category if category != 'error' else 'error' }}");
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
